<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Baskı & Modelleme Hizmetleri</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Özelleştirilmiş Tema Renklerimiz (Konsept 3) -->
    <style>
        body {
            background-color: #F3F4F6; /* Açık Gri/Beyaz Arka Plan */
            color: #1F2937; /* Koyu Gri Metin */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary {
            background-color: #2563EB; /* Güven Veren Parlak Mavi */
            border-color: #2563EB;
        }
        .btn-primary:hover {
            background-color: #4F46E5; /* Üzerine gelince Canlı Mor/Çivit Mavisi */
            border-color: #4F46E5;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 12px;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Üst Menü (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">3D Fabrika</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#urunler">Ürünler</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-primary fw-semibold" href="hesapla.html">Anında Fiyat Al</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="iletisim.html">İletişim</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Karşılama Alanı (Hero Section) -->
    <div class="container my-5">
        <div class="row align-items-center bg-white p-5 rounded-4 shadow-sm">
            <div class="col-lg-6">
                <h1 class="display-5 fw-bold mb-3">Hayalindeki Modeli Gerçeğe Dönüştür</h1>
                <p class="lead text-muted mb-4">.stl dosyanı yükle, anında fiyat tahmini al. Creality ve Bambu Lab kalitesiyle hızlı ve pürüzsüz baskı hizmeti. Konya içi elden teslimat seçeneğiyle!</p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                    <a href="hesapla.html" class="btn btn-primary btn-lg px-4 me-md-2">Fiyat Hesapla</a>
                    <a href="#urunler" class="btn btn-outline-secondary btn-lg px-4">Vitrine Göz At</a>
                </div>
            </div>
            <div class="col-lg-6 text-center mt-4 mt-lg-0">
                <!-- Şimdilik yer tutucu bir görsel kullanıyoruz -->
                <img src="https://via.placeholder.com/500x350?text=3D+Yazici+Gorseli" class="img-fluid rounded-3 shadow" alt="3D Baskı Hizmeti">
            </div>
        </div>
    </div>

    <!-- Ürünler Vitrini -->
    <div class="row" id="urunlerKutusu">
    <!-- Veri tabanından gelen ürünler buraya JavaScript ile eklenecek -->
</div>

    <!-- Bootstrap 5 JS (Menünün açılıp kapanması için gerekli) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urunlerKutusu = document.getElementById('urunlerKutusu');
        
        try {
            // Sunucudan ürünleri çek
            const response = await fetch('https://website3d-93zb.onrender.com/api/urunler');
            const urunler = await response.json();
            
            // Eğer ürün yoksa
            if(urunler.length === 0) {
                urunlerKutusu.innerHTML = '<p class="text-center text-muted">Henüz hiç ürün eklenmemiş.</p>';
                return;
            }

            // Gelen her bir ürün için HTML kartı oluştur
            let htmlIcerik = '';
            urunler.forEach(urun => {
                htmlIcerik += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm border-primary">
                            <div class="card-body">
                                <h5 class="card-title text-primary">${urun.isim}</h5>
                                <p class="card-text text-muted">${urun.aciklama.substring(0, 60)}...</p>
                                <h6 class="text-dark fw-bold">${urun.fiyat} ₺</h6>
                                <p class="small text-secondary mb-3">Malzeme: ${urun.malzeme}</p>
                                <a href="detay.html?id=${urun._id}" class="btn btn-outline-primary w-100">3D Görüntüle ve İncele</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Oluşturulan HTML'i sayfaya bas
            urunlerKutusu.innerHTML = htmlIcerik;

        } catch (error) {
            console.error("Ürünler çekilirken hata:", error);
            urunlerKutusu.innerHTML = '<p class="text-center text-danger">Ürünler yüklenirken bir hata oluştu.</p>';
        }
    });
</script>

</body>
</html>
