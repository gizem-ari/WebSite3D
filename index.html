<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Baskı & Modelleme Hizmetleri</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Özelleştirilmiş Tema Renklerimiz (Konsept 3) -->
    <style>
        body {
            background-color: #F3F4F6; /* Açık Gri/Beyaz Arka Plan */
            color: #1F2937; /* Koyu Gri Metin */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary {
            background-color: #2563EB; /* Güven Veren Parlak Mavi */
            border-color: #2563EB;
        }
        .btn-primary:hover {
            background-color: #4F46E5; /* Üzerine gelince Canlı Mor/Çivit Mavisi */
            border-color: #4F46E5;
        }
        .product-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 12px;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Üst Menü (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">3D Fabrika</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Statik menüyü JS'in ezmesini engellemek için burayı boş bırakıyoruz. JS Dolduracak. -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Karşılama Alanı (Hero Section) -->
    <div class="container my-5">
        <div class="row align-items-center bg-white p-5 rounded-4 shadow-sm">
            <div class="col-lg-6">
                <h1 class="display-5 fw-bold mb-3">Hayalindeki Modeli Gerçeğe Dönüştür</h1>
                <p class="lead text-muted mb-4">.stl dosyanı yükle, anında fiyat tahmini al. Creality ve Bambu Lab kalitesiyle hızlı ve pürüzsüz baskı hizmeti. Konya içi elden teslimat seçeneğiyle!</p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                    <a href="hesapla.html" class="btn btn-primary btn-lg px-4 me-md-2">Fiyat Hesapla</a>
                    <a href="#urunlerKutusu" class="btn btn-outline-secondary btn-lg px-4">Vitrine Göz At</a>
                </div>
            </div>
            <div class="col-lg-6 text-center mt-4 mt-lg-0">
                <!-- Şimdilik yer tutucu bir görsel kullanıyoruz -->
                <img src="https://via.placeholder.com/500x350?text=3D+Yazici+Gorseli" class="img-fluid rounded-3 shadow" alt="3D Baskı Hizmeti">
            </div>
        </div>
    </div>

    <!-- Ürünler Vitrini -->
    <div class="container mb-5">
        <h3 class="fw-bold mb-4">Hazır Modellerimiz</h3>
        <div class="row" id="urunlerKutusu">
            <!-- Veri tabanından gelen ürünler buraya JavaScript ile eklenecek -->
            <div class="col-12 text-center text-muted">
                <p>Vitrindeki ürünler yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 1. VİTRİN ÜRÜNLERİNİ ÇEKME VE KARTLARI OLUŞTURMA -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urunlerKutusu = document.getElementById('urunlerKutusu');
            
            try {
                const response = await fetch('https://website3d-93zb.onrender.com/api/urunler');
                const urunler = await response.json();
                
                if(urunler.length === 0) {
                    urunlerKutusu.innerHTML = '<p class="text-center text-muted">Henüz hiç ürün eklenmemiş.</p>';
                    return;
                }

                let htmlIcerik = '';
                urunler.forEach(urun => {
                    // Ürün ismini URL parametresi formatına çeviriyoruz (Örn: "Hareketli Ejderha" -> "Hareketli%20Ejderha")
                    const urlUrunAdi = encodeURIComponent(urun.isim);
                    
                    // Akıllı Yönlendirme Linkimiz:
                    const siparisLinki = `iletisim.html?kaynak=vitrin&fiyat=${urun.fiyat}&urun=${urlUrunAdi}`;
                    
                    // Stok Durumuna Göre Etiket Rengi Belirleme
                    let stokEtiketi = `<span class="badge bg-success float-end">Stokta Var</span>`;
                    if (urun.stokDurumu === 'Tükendi') {
                        stokEtiketi = `<span class="badge bg-danger float-end">Tükendi</span>`;
                    } else if (urun.stokDurumu === 'Siparişe Özel Üretim') {
                        stokEtiketi = `<span class="badge bg-info text-dark float-end">Siparişe Üretim</span>`;
                    }

                    // Tükendiyse Butonu Pasif (Disabled) Yap
                    const butonHtml = (urun.stokDurumu === 'Tükendi') 
                        ? `<button class="btn btn-secondary w-100 fw-bold py-2 mb-2" disabled>Stokta Yok</button>`
                        : `<a href="${siparisLinki}" class="btn btn-primary w-100 fw-bold py-2 mb-2">Hemen Sipariş Ver</a>`;

                    htmlIcerik += `
                        <div class="col-md-4 mb-4">
                            <div class="card product-card h-100 shadow-sm border-0 bg-white p-2">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title fw-bold text-dark mb-3">${urun.isim} ${stokEtiketi}</h5>
                                    <p class="card-text text-muted flex-grow-1 small">${urun.aciklama}</p>
                                    
                                    <div class="mt-3 mb-3">
                                        <h4 class="text-primary fw-bold mb-1">${urun.fiyat} ₺</h4>
                                        <p class="small text-secondary mb-0">Malzeme: <span class="fw-semibold text-dark">${urun.malzeme || 'Belirtilmedi'}</span></p>
                                    </div>
                                    
                                    ${butonHtml}
                                    <a href="detay.html?id=${urun._id}" class="btn btn-outline-secondary btn-sm w-100">3D İncele (Çok Yakında)</a>
                                </div>
                            </div>
                        </div>
                    `;
                });

                urunlerKutusu.innerHTML = htmlIcerik;

            } catch (error) {
                console.error("Ürünler çekilirken hata:", error);
                urunlerKutusu.innerHTML = '<p class="text-center text-danger">Ürünler yüklenirken bir hata oluştu.</p>';
            }
        });
    </script>

    <!-- 2. DİNAMİK MENÜ (NAVBAR) VE ÇIKIŞ İŞLEMLERİ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const kullaniciStr = localStorage.getItem('kullanici');
            const navbarUl = document.querySelector('#navbarNav ul');

            if (token && kullaniciStr) {
                // KULLANICI GİRİŞ YAPMIŞSA
                const kullanici = JSON.parse(kullaniciStr);
                navbarUl.innerHTML = `
                    <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle fw-semibold" href="#" role="button" data-bs-toggle="dropdown">
                            👤 Merhaba, ${kullanici.isim}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
                            ${kullanici.rol === 'admin' ? '<li><a class="dropdown-item text-danger fw-bold" href="admin.html">⚙️ Admin Paneli</a></li><li><hr class="dropdown-divider"></li>' : ''}
                            <li><a class="dropdown-item text-muted" href="#" onclick="cikisYap()">🚪 Çıkış Yap</a></li>
                        </ul>
                    </li>
                `;
            } else {
                // ZİYARETÇİ İSE
                navbarUl.innerHTML = `
                    <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="kayit.html">Kayıt Ol</a></li>
                    <li class="nav-item"><a class="nav-link text-primary fw-bold" href="giris.html">Giriş Yap</a></li>
                `;
            }
        });

        function cikisYap() {
            localStorage.removeItem('token');
            localStorage.removeItem('kullanici');
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
