<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim ve Sipariş | 3D Fabrika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #F3F4F6;
            color: #1F2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary { background-color: #2563EB; border-color: #2563EB; }
        .btn-primary:hover { background-color: #4F46E5; border-color: #4F46E5; }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">3D Fabrika</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#urunler">Ürünler</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link text-primary fw-semibold" href="iletisim.html">İletişim</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Alanı -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <h2 class="fw-bold mb-4 text-primary text-center">Sipariş ve İletişim Formu</h2>
                        
                        <form id="siparisFormu">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Adınız Soyadınız</label>
                                <input type="text" class="form-control" id="musteriAd" required>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">E-posta Adresiniz</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Telefon Numaranız</label>
                                    <input type="tel" class="form-control" id="telefon">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">İlgilendiğiniz Ürün</label>
                                <select class="form-select" id="ilgilenilenUrun">
                                    <option value="Özel Tasarım / Diğer">Özel Tasarım / Diğer (Dosya Yükleyeceğim)</option>
                                    <!-- Veri tabanındaki ürünler buraya JS ile eklenecek -->
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mesajınız / Özel İstekleriniz</label>
                                <textarea class="form-control" id="mesaj" rows="4" placeholder="Renk tercihi, boyut isteği veya proje detaylarınızı yazabilirsiniz..." required></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Referans Görsel veya 3D Model (İsteğe Bağlı)</label>
                                <input class="form-control" type="file" id="dosyaYukle">
                                <div class="form-text">Maksimum 10MB. JPG, PNG veya STL formatları desteklenir.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2" id="gonderButonu">Siparişi Gönder</button>
                        </form>

                        <!-- Kullanıcıya gösterilecek işlem durumu mesajları -->
                        <div id="sonucMesaji" class="mt-4 text-center fw-bold fs-5"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urunSelect = document.getElementById('ilgilenilenUrun');
            
            // 1. Veri tabanındaki ürünleri çekip "İlgilendiğiniz Ürün" listesine ekle
            try {
                const response = await fetch('https://website3d-93zb.onrender.com/api/urunler');
                const urunler = await response.json();
                
                urunler.forEach(urun => {
                    const option = document.createElement('option');
                    option.value = urun.isim;
                    option.textContent = urun.isim;
                    urunSelect.appendChild(option);
                });

                // 2. URL'de parametre varsa (Örn: iletisim.html?urun=Yelpaze), listede onu otomatik seç
                const urlParams = new URLSearchParams(window.location.search);
                const gelenUrun = urlParams.get('urun');
                if (gelenUrun) {
                    urunSelect.value = gelenUrun;
                }
            } catch (error) {
                console.error("Ürünler form listesine yüklenemedi:", error);
            }
        });

        // Form Gönderme İşlemi
        document.getElementById('siparisFormu').addEventListener('submit', async (event) => {
            event.preventDefault(); // Sayfa yenilenmesini engelle
            
            const gonderButonu = document.getElementById('gonderButonu');
            const sonucMesaji = document.getElementById('sonucMesaji');
            const dosyaInput = document.getElementById('dosyaYukle');
            
            // İşlem sürerken butonu kilitle
            gonderButonu.disabled = true;
            gonderButonu.innerText = "İşlemler Yapılıyor... Lütfen Bekleyin";
            sonucMesaji.className = "mt-4 text-center fw-bold text-primary";
            sonucMesaji.innerText = "Hazırlanıyor...";

            let cloudDosyaUrl = "";

            try {
                // ADIM 1: Eğer kullanıcı dosya seçmişse, Node.js'i aradan çıkarıp doğrudan Cloudinary'ye gönder
                if (dosyaInput.files.length > 0) {
                    sonucMesaji.innerText = "Dosya buluta yükleniyor... ⏳";
                    
                    const formData = new FormData();
                    formData.append('file', dosyaInput.files[0]);
                    formData.append('upload_preset', 'siparis_gorselleri'); // Senin belirlediğin isim

                    // Senin Cloud Name bilginle istek atıyoruz (km6ul35l)
                    const cloudRes = await fetch('https://api.cloudinary.com/v1_1/km6ul35l/auto/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const cloudData = await cloudRes.json();
                    if (cloudData.secure_url) {
                        cloudDosyaUrl = cloudData.secure_url; // Oluşan güvenli URL'yi al
                    } else {
                        throw new Error("Cloudinary yüklemesi reddedildi.");
                    }
                }

                // ADIM 2: Form metinlerini ve (eğer varsa) Cloudinary URL'sini bizim Node.js sunucumuza gönder
                sonucMesaji.innerText = "Siparişiniz veri tabanına kaydediliyor... 💾";
                
                const siparisVerisi = {
                    musteriAd: document.getElementById('musteriAd').value,
                    email: document.getElementById('email').value,
                    telefon: document.getElementById('telefon').value,
                    ilgilenilenUrun: document.getElementById('ilgilenilenUrun').value,
                    mesaj: document.getElementById('mesaj').value,
                    dosyaUrl: cloudDosyaUrl // URL'yi MongoDB şemasına yolluyoruz
                };

                const backendRes = await fetch('https://website3d-93zb.onrender.com/api/siparisler', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(siparisVerisi)
                });

                if (backendRes.ok) {
                    // İşlem tamamen bittiğinde
                    sonucMesaji.className = "mt-4 text-center fw-bold text-success";
                    sonucMesaji.innerText = "🎉 Siparişiniz başarıyla alındı! Detaylar için sizinle iletişime geçeceğiz.";
                    document.getElementById('siparisFormu').reset(); // Formu temizle
                } else {
                    throw new Error("MongoDB kaydı sırasında sunucu hatası.");
                }

            } catch (error) {
                console.error(error);
                sonucMesaji.className = "mt-4 text-center fw-bold text-danger";
                sonucMesaji.innerText = "❌ Bir hata oluştu: " + error.message;
            } finally {
                // Butonu eski haline getir
                gonderButonu.disabled = false;
                gonderButonu.innerText = "Siparişi Gönder";
            }
        });
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const kullaniciStr = localStorage.getItem('kullanici');
        const navbarUl = document.querySelector('#navbarNav ul');

        if (token && kullaniciStr) {
        // 1. DURUM: KULLANICI GİRİŞ YAPMIŞSA (Dropdown Menü Tasarımı)
        const kullanici = JSON.parse(kullaniciStr);
        navbarUl.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
            <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle fw-semibold text-primary" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    👤 Merhaba, ${kullanici.isim}
                </a>
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
                    ${kullanici.rol === 'admin' ? '<li><a class="dropdown-item text-danger fw-bold" href="admin.html">⚙️ Admin Paneli</a></li><li><hr class="dropdown-divider"></li>' : ''}
                    <li><a class="dropdown-item text-muted" href="#" onclick="cikisYap()">🚪 Çıkış Yap</a></li>
                </ul>
            </li>
        `;
    } else {
            // 2. DURUM: KULLANICI GİRİŞ YAPMAMIŞSA (Ziyaretçi)
            navbarUl.innerHTML = `
                <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                <li class="nav-item"><a class="nav-link fw-semibold" href="kayit.html">Kayıt Ol</a></li>
                <li class="nav-item"><a class="nav-link text-primary fw-bold" href="giris.html">Giriş Yap</a></li>
            `;
        }
    });

    // Çıkış yapma fonksiyonu
    function cikisYap() {
        localStorage.removeItem('token');
        localStorage.removeItem('kullanici');
        window.location.href = 'index.html'; // Çıkış yapınca ana sayfaya yönlendir
    }
</script>
</body>
</html>
