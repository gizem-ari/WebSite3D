<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ücretsiz Kayıt Ol | 3D Fabrika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F3F4F6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">3D Fabrika</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-semibold" href="kayit.html">Kayıt Ol</a></li>
                    <li class="nav-item"><a class="nav-link" href="giris.html">Giriş Yap</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Kayıt Formu -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4 p-md-5 bg-white">
                    <h3 class="fw-bold text-center mb-4">Aramıza Katıl</h3>
                    
                    <form id="kayitFormu">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Adınız Soyadınız</label>
                            <input type="text" id="isim" class="form-control" required placeholder="Örn: Gizem Arı">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">E-Posta Adresiniz</label>
                            <input type="email" id="email" class="form-control" required placeholder="ornek@mail.com">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Şifreniz</label>
                            <input type="password" id="sifre" class="form-control" required placeholder="En az 6 karakter">
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="kayitButonu">
                            Kayıt Ol
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted small">Zaten hesabın var mı? <a href="giris.html" class="text-primary text-decoration-none fw-semibold">Giriş Yap</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript - Backend Bağlantısı -->
    <script>
        document.getElementById('kayitFormu').addEventListener('submit', async (e) => {
            e.preventDefault(); // Sayfanın yenilenmesini durdurur
            
            const isim = document.getElementById('isim').value;
            const email = document.getElementById('email').value;
            const sifre = document.getElementById('sifre').value;
            const kayitButonu = document.getElementById('kayitButonu');

            // Butonu tıklanamaz yapıp 'Bekleniyor' efekti veriyoruz
            kayitButonu.disabled = true;
            kayitButonu.innerText = 'Kaydediliyor...';

            try {
                // Render'daki canlı API'mize verileri gönderiyoruz
                const response = await fetch('https://website3d-93zb.onrender.com/api/auth/kayit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isim, email, sifre })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("✅ " + data.mesaj + " Şimdi giriş yapabilirsiniz.");
                    window.location.href = 'giris.html'; // Başarılıysa giriş sayfasına yönlendir
                } else {
                    alert("❌ Hata: " + data.mesaj); // E-posta zaten varsa hata verir
                }
            } catch (error) {
                console.error('Bağlantı hatası:', error);
                alert("❌ Sunucuya ulaşılamadı. Lütfen daha sonra tekrar deneyin.");
            } finally {
                // İşlem bitince butonu eski haline getiriyoruz
                kayitButonu.disabled = false;
                kayitButonu.innerText = 'Kayıt Ol';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
