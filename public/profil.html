<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesabım & Siparişlerim | 3D Fabrika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #F3F4F6;
            color: #1F2937;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary { background-color: #2563EB; border-color: #2563EB; }
        .btn-primary:hover { background-color: #4F46E5; border-color: #4F46E5; }
        
        .order-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        
        /* Durum Renkleri için Özelleştirme */
        .status-bekliyor { background-color: #FEF3C7; color: #D97706; } /* Sarı / Turuncu */
        .status-uretimde { background-color: #DBEAFE; color: #1D4ED8; } /* Mavi */
        .status-tamamlandi { background-color: #D1FAE5; color: #047857; } /* Yeşil */
        .status-iptal { background-color: #FEE2E2; color: #B91C1C; } /* Kırmızı */
    </style>
</head>
<body>

    <<!-- Üst Menü -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images\logo.png" alt="BAGİ Tasarım" height="35" class="me-2">
            <span class="text-primary" style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 800; letter-spacing: 1px;">BAGİ TASARIM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"></ul>
        </div>
    </div>
</nav>

    <!-- Profil ve Siparişler Ana Konteyneri -->
    <div class="container my-5">
        <div class="row">
            
            <!-- Sol Menü (Kullanıcı Bilgileri) -->
            <div class="col-lg-3 mb-4">
                <div class="card border-0 rounded-4 shadow-sm text-center p-4">
                    <div class="mb-3">
                        <span class="display-3">👤</span>
                    </div>
                    <h5 class="fw-bold mb-1" id="profilIsim">Yükleniyor...</h5>
                    <p class="text-muted small mb-3" id="profilEmail">Yükleniyor...</p>
                    <hr>
                    <button class="btn btn-outline-danger w-100 fw-bold" onclick="cikisYap()">🚪 Çıkış Yap</button>
                </div>
            </div>

            <!-- Sağ Taraf (Siparişler) -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold mb-0">📦 Siparişlerim</h3>
                    <button class="btn btn-primary btn-sm fw-bold" onclick="siparisleriGetir()">🔄 Yenile</button>
                </div>

                <!-- Sipariş Kartlarının Listeleneceği Alan -->
                <div id="siparisKutusu">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="text-muted mt-2">Siparişleriniz yükleniyor...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Geliştirici İmzası ve Alt Bilgi -->
    <div class="container text-center mt-5 pt-4 border-top text-muted small pb-4">
        <p>&copy; 2026 BAGİ Tasarım. Tüm hakları saklıdır.</p>
        <p>Designed & Developed by <a href="https://fatmagizemari.com.tr" target="_blank" class="text-primary text-decoration-none fw-semibold">Fatma Gizem Arı</a> | 
        <a href="https://github.com/gizem-ari" target="_blank" class="text-secondary text-decoration-none">GitHub</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dinamik Veri ve Menü Yönetimi -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const kullaniciStr = localStorage.getItem('kullanici');
            
            // 1. GÜVENLİK KONTROLÜ: Giriş yapılmamışsa sayfayı gösterme!
            if (!token || !kullaniciStr) {
                alert("Bu sayfayı görüntülemek için giriş yapmalısınız.");
                window.location.href = 'giris.html';
                return;
            }

            const kullanici = JSON.parse(kullaniciStr);
            
            // 2. KULLANICI BİLGİLERİNİ SOL MENÜYE YAZDIR
            document.getElementById('profilIsim').innerText = kullanici.isim;
            document.getElementById('profilEmail').innerText = kullanici.email;

            // 3. ÜST MENÜYÜ ÇİZ
            const navbarUl = document.querySelector('#navbarNav ul');
            navbarUl.innerHTML = `
                <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle fw-semibold text-primary active" href="#" role="button" data-bs-toggle="dropdown">
                        👤 Merhaba, ${kullanici.isim}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
                        <li><a class="dropdown-item fw-bold text-primary" href="profil.html">📦 Siparişlerim</a></li>
                        ${kullanici.rol === 'admin' ? '<li><a class="dropdown-item text-danger fw-bold" href="admin.html">⚙️ Admin Paneli</a></li>' : ''}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-muted" href="#" onclick="cikisYap()">🚪 Çıkış Yap</a></li>
                    </ul>
                </li>
            `;

            // 4. SİPARİŞLERİ GETİR (Sayfa yüklendiğinde otomatik tetiklenir)
            siparisleriGetir();
        });

        // KULLANICIYA ÖZEL SİPARİŞLERİ API'DEN ÇEKME FONKSİYONU
        async function siparisleriGetir() {
            const siparisKutusu = document.getElementById('siparisKutusu');
            const kullanici = JSON.parse(localStorage.getItem('kullanici'));
            
            siparisKutusu.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';

            try {
                // Backend'de yeni oluşturduğumuz özel API'ye kullanıcının email adresini yolluyoruz
                const response = await fetch(`https://website3d-93zb.onrender.com/api/siparislerim/${kullanici.email}`);
                
                if (!response.ok) throw new Error("Siparişler alınamadı.");
                
                const data = await response.json();
                const siparisler = data.siparisler;

                if (!siparisler || siparisler.length === 0) {
                    siparisKutusu.innerHTML = `
                        <div class="card border-0 rounded-4 p-5 text-center bg-white shadow-sm">
                            <h1 class="display-1 text-muted mb-3">📭</h1>
                            <h4 class="text-secondary fw-bold">Henüz hiç siparişiniz yok.</h4>
                            <p class="text-muted">Hemen vitrinimize göz atıp sipariş oluşturabilirsiniz.</p>
                            <a href="index.html#urunlerKutusu" class="btn btn-primary mt-3">Vitrini İncele</a>
                        </div>
                    `;
                    return;
                }

                let htmlIcerik = '';

                siparisler.forEach((siparis, index) => {
                    // Tarih formatını güzelleştir
                    const tarih = new Date(siparis.createdAt).toLocaleDateString('tr-TR', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Duruma Göre Badge Rengi ve İkon Belirleme
                    let badgeClass = 'status-bekliyor';
                    let durumIkonu = '⏳';
                    
                    if (siparis.durum.toLowerCase().includes('üretimde') || siparis.durum.toLowerCase().includes('basılıyor')) {
                        badgeClass = 'status-uretimde';
                        durumIkonu = '⚙️';
                    } else if (siparis.durum.toLowerCase().includes('tamamlandı') || siparis.durum.toLowerCase().includes('kargo')) {
                        badgeClass = 'status-tamamlandi';
                        durumIkonu = '✅';
                    } else if (siparis.durum.toLowerCase().includes('iptal')) {
                        badgeClass = 'status-iptal';
                        durumIkonu = '❌';
                    }

                    // İptal Butonu Mantığı (Sadece "Bekliyor" durumundayken görünür)
                    let iptalButonuHtml = '';
                    if (siparis.durum === 'Bekliyor') {
                        iptalButonuHtml = `
                            <button class="btn btn-outline-danger btn-sm mt-3 w-100" onclick="iptalTalebiOlustur('${siparis._id}')">
                                İptal Talebi Gönder
                            </button>
                        `;
                    } else {
                        iptalButonuHtml = `<p class="small text-muted text-center mt-3 mb-0">Bu sipariş ${siparis.durum.toLowerCase()} aşamasında olduğu için iptal edilemez.</p>`;
                    }

                    // Sipariş Kartı Tasarımı
                    htmlIcerik += `
                        <div class="card order-card bg-white p-4 mb-4">
                            <div class="row align-items-center">
                                <div class="col-md-8">
                                    <div class="d-flex align-items-center mb-2">
                                        <span class="badge ${badgeClass} px-3 py-2 rounded-pill fw-bold me-2">
                                            ${durumIkonu} ${siparis.durum}
                                        </span>
                                        <small class="text-muted">${tarih}</small>
                                    </div>
                                    <h5 class="fw-bold text-dark mt-2 mb-1">
                                        ${siparis.dosyaAdi !== 'Dosya Yok' && siparis.dosyaAdi !== 'Belirtilmedi' ? siparis.dosyaAdi : 'Özel 3D Baskı Siparişi'}
                                    </h5>
                                    <p class="text-muted small mb-0"><strong>Mesajınız:</strong> ${siparis.mesaj || 'Mesaj bırakılmadı.'}</p>
                                </div>
                                <div class="col-md-4 text-md-end mt-3 mt-md-0 border-start border-light">
                                    <p class="text-muted small mb-1">Sipariş Tutarı</p>
                                    <h4 class="fw-bold text-primary mb-0">${siparis.fiyat} ₺</h4>
                                    ${iptalButonuHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                siparisKutusu.innerHTML = htmlIcerik;

            } catch (error) {
                console.error("Hata:", error);
                siparisKutusu.innerHTML = `
                    <div class="alert alert-danger text-center">
                        Siparişleriniz yüklenirken bir bağlantı hatası oluştu. Lütfen sayfayı yenileyin.
                    </div>
                `;
            }
        }

        // İPTAL TALEBİ GÖNDERME FONKSİYONU (İleride Backend'e bağlanacak)
        function iptalTalebiOlustur(siparisId) {
            const onay = confirm("Bu sipariş için iptal talebi oluşturmak istediğinize emin misiniz? (Admin'e bildirim gidecektir.)");
            if (onay) {
                // Şimdilik sadece Frontend mesajı (Gerçek bir iptal için server.js'ye "İptal İstendi" diye durum güncelleme API'si yazılmalı)
                alert("İptal talebiniz yöneticiye iletildi. En kısa sürede işleme alınacaktır.");
                
                /* İLERİDE AKTİF EDİLECEK API KODU:
                fetch(`https://website3d-93zb.onrender.com/api/siparisler/${siparisId}/durum`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ durum: 'İptal Edildi (Müşteri)' })
                }).then(() => siparisleriGetir());
                */
            }
        }

        function cikisYap() {
            localStorage.removeItem('token');
            localStorage.removeItem('kullanici');
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
