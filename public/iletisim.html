<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim & Sipariş | 3D Fabrika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Üst Menü -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images\logo.png" alt="BAGİ Tasarım" height="35" class="me-2">
            <span class="text-primary" style="font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 800; letter-spacing: 1px;">BAGİ TASARIM</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"></ul>
        </div>
    </div>
    </nav>

    <!-- İletişim / Sipariş Formu -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4">
                    <h2 class="fw-bold text-center mb-1" id="sayfaBasligi">İletişim & Sipariş</h2>
                    <p class="text-muted text-center mb-4" id="sayfaAciklamasi">Bizimle iletişime geçin veya sipariş detaylarınızı gönderin.</p>
                    
                    <form id="iletisimFormu">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Adınız Soyadınız</label>
                                <input type="text" id="isimInput" class="form-control fw-bold" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">E-posta Adresiniz</label>
                                <input type="email" id="emailInput" class="form-control" required>
                            </div>
                        </div>

                        <!-- Akıllı Fiyat Alanı -->
                        <div class="mb-3" id="fiyatAlani" style="display: none;">
                            <label class="form-label text-muted small">Sipariş Tutarı</label>
                            <input type="text" id="fiyatInput" class="form-control fw-bold text-primary bg-light" readonly>
                        </div>

                        <div class="mb-3" id="dosyaYuklemeAlani">
                            <label class="form-label text-muted small">Model Dosyası veya Görsel (.stl, .png, .jpg)</label>
                            <input type="file" id="dosyaInput" class="form-control border-primary">
                            <div class="form-text" id="dosyaAciklama">Sorularınız, tasarımlarınız veya özel siparişleriniz için dosya yükleyebilirsiniz.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small">Mesajınız / Talepleriniz</label>
                            <textarea id="mesajInput" class="form-control" rows="4" placeholder="Mesajınızı veya baskı detaylarını (renk, doluluk vb.) buraya yazabilirsiniz..." required></textarea>
                        </div>

                        <button type="submit" id="gonderBtn" class="btn btn-primary w-100 py-3 fw-bold fs-5">Gönder</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Geliştirici İmzası ve Alt Bilgi -->
    <div class="container text-center mt-5 pt-4 border-top text-muted small pb-4">
        <p>&copy; 2026 BAGİ Tasarım. Tüm hakları saklıdır.</p>
        <p>Designed & Developed by <a href="https://fatmagizemari.com.tr" target="_blank" class="text-primary text-decoration-none fw-semibold">Fatma Gizem Arı</a> | 
        <a href="https://github.com/gizem-ari" target="_blank" class="text-secondary text-decoration-none">GitHub</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const kullaniciStr = localStorage.getItem('kullanici');
            const navbarUl = document.querySelector('#navbarNav ul');

            // --- 1. MENÜ VE OTOMATİK DOLDURMA İŞLEMİ ---
            if (token && kullaniciStr) {
                const kullanici = JSON.parse(kullaniciStr);
                
                // Kullanıcı Giriş Yapmışsa Menü
                navbarUl.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-semibold" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle fw-semibold" href="#" role="button" data-bs-toggle="dropdown">
                            👤 Merhaba, ${kullanici.isim}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow">
                            <li><a class="dropdown-item fw-bold text-primary" href="profil.html">📦 Siparişlerim</a></li>
                            ${kullanici.rol === 'admin' ? '<li><a class="dropdown-item text-danger fw-bold" href="admin.html">⚙️ Admin Paneli</a></li>' : ''}
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-muted" href="#" onclick="cikisYap()">🚪 Çıkış Yap</a></li>
                        </ul>
                    </li>
                `;
                
                // Formu otomatik doldur ve kitle
                const isimKutusu = document.getElementById('isimInput');
                isimKutusu.value = kullanici.isim;
                isimKutusu.readOnly = true;
                isimKutusu.classList.add('bg-light');
                
                const emailKutusu = document.getElementById('emailInput');
                emailKutusu.value = kullanici.email;
                emailKutusu.readOnly = true;
                emailKutusu.classList.add('bg-light');

            } else {
                // Ziyaretçi Menüsü (Formu kendisi dolduracak, inputlar serbest)
                navbarUl.innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="hesapla.html">Anında Fiyat Al</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-semibold" href="iletisim.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="kayit.html">Kayıt Ol</a></li>
                    <li class="nav-item"><a class="nav-link text-primary fw-bold" href="giris.html">Giriş Yap</a></li>
                `;
            }

            // --- 2. URL PARAMETRELERİNİ OKUMA (AKILLI FORMU ŞEKİLLENDİRME) ---
            // Adres çubuğundaki "?kaynak=..." kısımlarını yakalıyoruz
            const urlParams = new URLSearchParams(window.location.search);
            const kaynak = urlParams.get('kaynak');
            const gelenFiyat = urlParams.get('fiyat');
            const urunAdi = urlParams.get('urun');

            if (kaynak === 'hesapla' && gelenFiyat) {
                // HESAPLA SAYFASINDAN GELENLER
                document.getElementById('sayfaBasligi').innerText = 'Özel Siparişi Tamamla';
                document.getElementById('sayfaAciklamasi').innerText = 'Özel baskı talebiniz için onay verin ve dosyanızı yükleyin.';
                document.getElementById('fiyatInput').value = gelenFiyat + " ₺ (Özel Hesaplama)";
                document.getElementById('fiyatAlani').style.display = 'block';
                document.getElementById('gonderBtn').innerText = 'Siparişi Onayla ve Gönder';

            } else if (kaynak === 'vitrin' && gelenFiyat && urunAdi) {
                // VİTRİN ÜRÜNÜNDEN GELENLER (İlerisi için hazırlık)
                document.getElementById('sayfaBasligi').innerText = 'Ürün Siparişi';
                document.getElementById('sayfaAciklamasi').innerText = 'Seçtiğiniz ürünün siparişini tamamlayın.';
                document.getElementById('fiyatInput').value = gelenFiyat + " ₺ (" + urunAdi + ")";
                document.getElementById('fiyatAlani').style.display = 'block';
                document.getElementById('mesajInput').value = `"${urunAdi}" isimli ürün için sipariş oluşturuyorum.\nEkstra notlarım:\n`;
                document.getElementById('gonderBtn').innerText = 'Siparişi Onayla ve Gönder';
                document.getElementById('dosyaYuklemeAlani').style.display = 'none';

            } else {
                // DOĞRUDAN İLETİŞİM LİNKİNE TIKLAYANLAR
                // Varsayılan halinde kalır, fiyat bölümü gizli kalmaya devam eder.
            }
        });

        function cikisYap() {
            localStorage.removeItem('token');
            localStorage.removeItem('kullanici');
            window.location.href = 'index.html';
        }

        // --- 3. FORMU VERİTABANINA GÖNDERME ---
        document.getElementById('iletisimFormu').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('gonderBtn');
            btn.disabled = true;
            btn.innerText = 'İletiliyor...';

            const dosyaInput = document.getElementById('dosyaInput');
            const dosyaAdi = (dosyaInput.files.length > 0) ? dosyaInput.files[0].name : 'Dosya Yok';

            // Adres çubuğundaki fiyatı bulalım (Eğer varsa)
            const urlParams = new URLSearchParams(window.location.search);
            const siparisFiyati = parseFloat(urlParams.get('fiyat')) || 0;

            const yeniSiparis = {
                isim: document.getElementById('isimInput').value,
                email: document.getElementById('emailInput').value,
                dosyaAdi: dosyaAdi,
                fiyat: siparisFiyati,
                mesaj: document.getElementById('mesajInput').value
            };

            try {
                const response = await fetch('https://website3d-93zb.onrender.com/api/siparisler', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(yeniSiparis)
                });

                if (response.ok) {
                    alert("✅ Talebiniz başarıyla alındı! En kısa sürede iletişime geçeceğiz.");
                    // İşlem bitince parametresiz temiz ana sayfaya yönlendir
                    window.location.href = 'index.html';
                } else {
                    alert("❌ İşlem sırasında bir hata meydana geldi.");
                }
            } catch (error) {
                alert("Sunucuya bağlanılamadı.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Gönder';
            }
        });
    </script>
</body>
</html>
